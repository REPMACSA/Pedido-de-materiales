<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pedidos de Materiales — Técnico</title>
<style>
  :root { --navy:#1C2B4A; --gold:#C9A24B; --border:#e2e8f0; --text:#1e293b; --muted:#64748b; --light:#F1F5F9; }
  * { box-sizing:border-box; }
  body { font-family:'Segoe UI', Arial, sans-serif; margin:0; padding:0; background:#f1f5f9; color:var(--text); }
  .topbar { background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .topbar h1 { font-size:16px; margin:0; }
  .topbar-right { display:flex; align-items:center; gap:8px; }
  .topbar a, .topbar button { background:transparent; border:1.5px solid rgba(255,255,255,.5); color:#fff; border-radius:20px; padding:6px 13px; font-size:.75rem; font-weight:700; cursor:pointer; text-decoration:none; }
  .container { max-width:640px; margin:0 auto; padding:16px 14px 60px; }
  .card { background:#fff; border-radius:14px; padding:18px; box-shadow:0 4px 14px rgba(30,27,75,0.06); border:1px solid var(--border); margin-bottom:14px; }
  .card h3 { margin-top:0; color:var(--navy); }
  label { display:block; font-size:13px; font-weight:600; margin-top:12px; margin-bottom:5px; }
  select, input, textarea { width:100%; padding:10px; border:1.5px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; }
  .tipo-selector { display:flex; gap:8px; margin-top:6px; }
  .tipo-btn { flex:1; padding:14px 8px; border-radius:10px; border:2px solid var(--border); background:#fff; text-align:center; cursor:pointer; font-weight:700; font-size:13px; }
  .tipo-btn.activo.urgente { border-color:#dc2626; background:#fef2f2; color:#991b1b; }
  .tipo-btn.activo.reservar { border-color:#0369a1; background:#eff6ff; color:#0c4a6e; }
  button.guardar { background:var(--navy); color:#fff; border:none; padding:13px 20px; border-radius:10px; font-weight:700; margin-top:16px; cursor:pointer; width:100%; font-size:15px; }
  .resultado { margin-top:10px; font-size:13px; }
  .sin-acceso-box { max-width:420px; margin:80px auto; text-align:center; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { flex:1; background:#e2e8f0; color:#1f2937; border:none; padding:10px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; }
  .tabs button.active { background:var(--navy); color:#fff; }
  .pedido-item { border-left:5px solid #94a3b8; background:#fff; border-radius:8px; padding:12px 14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  .pedido-item.urgente { border-left-color:#dc2626; }
  .pedido-item.reservar { border-left-color:#0369a1; }
  .pedido-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .pedido-mat { font-weight:700; font-size:14.5px; }
  .pedido-id { font-size:10.5px; color:var(--muted); font-family:monospace; }
  .badge { display:inline-block; padding:3px 9px; border-radius:12px; font-size:11px; font-weight:700; color:#fff; margin-top:6px; }
  .pedido-det { font-size:12.5px; color:var(--muted); margin-top:4px; }
  .accion-box { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .accion-box button { width:auto; margin-top:0; padding:9px 14px; font-size:13px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>📦 Pedidos de Materiales</h1>
  <div class="topbar-right">
    <a href="https://repmacsa.github.io/Portal/">🏠 Portal</a>
    <span id="usuarioPortalTxt" style="font-size:.78rem;"></span>
    <button onclick="salirPortal()">🔒 Salir</button>
  </div>
</div>

<div class="container">

  <div id="sinAccesoBox" class="sin-acceso-box" style="display:none;">
    <p style="color:#dc2626;font-weight:600;">🔒 No hay una sesión activa del Portal.</p>
    <p style="font-size:13px;color:#64748b;">Entrá desde el Portal para acceder acá.</p>
    <a href="https://repmacsa.github.io/Portal/" style="display:inline-block;margin-top:8px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:600;">🏠 Ir al Portal</a>
  </div>

  <div id="appBox" style="display:none;">
    <div class="tabs">
      <button id="tabNuevo" class="active" onclick="mostrarTab('nuevo')">+ Nuevo pedido</button>
      <button id="tabMisPedidos" onclick="mostrarTab('mis')">📋 Mis pedidos <span id="badgeMisPedidos" style="display:none;background:#dc2626;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px;"></span></button>
    </div>

    <div id="vistaNuevo" class="card">
      <h3>Nuevo pedido</h3>
      <p style="font-size:12.5px;color:var(--muted);margin-top:-6px;">Administración va a definir si es urgente o a reservar — vos solo indicá qué necesitás.</p>

      <label>¿Qué material necesitás?</label>
      <input type="text" id="material" placeholder="Ej: Compresor 1/4 HP R404A">
      <label>Detalle (opcional — cliente, para qué es, etc.)</label>
      <textarea id="detalle" rows="2" placeholder="Opcional"></textarea>
      <button class="guardar" id="btnRegistrarPedido" onclick="crearPedido()">Registrar pedido</button>
      <div id="resultadoNuevo" class="resultado"></div>
    </div>

    <div id="vistaMisPedidos" class="card" style="display:none;">
      <h3>Mis pedidos</h3>
      <div id="listaMisPedidos"></div>
    </div>
  </div>
</div>

<script>
let SCRIPT_URL = localStorage.getItem('pedidos_scriptUrl') || 'https://script.google.com/macros/s/AKfycby5ESjr1NsLKeC_hS3bF9iurQLnOpgffaMR8VX4BAVP6Z3SHkWG7SCJr1zX0dlE7J_1/exec';

const ACCIONES_LECTURA_PEDIDOS = ['listarMisPedidos', 'getHistorial'];
let escrituraPedidosEnCurso = false;

function mostrarGuardandoPedidos_(mostrar) {
  let el = document.getElementById('guardandoPedidosOverlay');
  if (mostrar) {
    if (!el) {
      el = document.createElement('div');
      el.id = 'guardandoPedidosOverlay';
      el.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 20px;border-radius:8px;font-size:12.5px;font-weight:700;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.3);';
      el.textContent = '⏳ Guardando...';
      document.body.appendChild(el);
    }
  } else if (el) el.remove();
}

function api(action, data) {
  const esEscritura = ACCIONES_LECTURA_PEDIDOS.indexOf(action) === -1;
  if (esEscritura) {
    if (escrituraPedidosEnCurso) {
      return Promise.reject(new Error('Ya hay una acción guardándose — esperá un momento antes de repetirlo.'));
    }
    escrituraPedidosEnCurso = true;
    mostrarGuardandoPedidos_(true);
  }
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
    const limpiar = function() {
      delete window[cbName];
      script.remove();
      if (esEscritura) { escrituraPedidosEnCurso = false; mostrarGuardandoPedidos_(false); }
    };
    window[cbName] = function(payload) {
      limpiar();
      if (payload && payload.ok) resolve(payload);
      else reject(new Error((payload && payload.msg) || 'Error desconocido'));
    };
    const url = SCRIPT_URL + '?action=' + encodeURIComponent(action) + '&data=' + encodeURIComponent(JSON.stringify(data || {})) + '&callback=' + cbName;
    const script = document.createElement('script');
    script.src = url;
    script.onerror = function() { limpiar(); reject(new Error('No se pudo conectar')); };
    document.body.appendChild(script);
  });
}

// ══ SESIÓN DEL PORTAL ══
let usuarioPortal = null;
const SESION_TIMEOUT_MS = 5 * 60 * 1000;
let sesionLockTimer = null;

function leerSesionPortal_() {
  try {
    const raw = localStorage.getItem('portal_sesion');
    if (!raw) return null;
    const s = JSON.parse(raw);
    const horas = (Date.now() - s.ts) / (1000 * 60 * 60);
    if (horas > 10) { localStorage.removeItem('portal_sesion'); return null; }
    return s;
  } catch(e) { return null; }
}
function reiniciarTimerSesion_(){
  clearTimeout(sesionLockTimer);
  sesionLockTimer = setTimeout(salirPortal, SESION_TIMEOUT_MS);
}
function activarVigilanciaSesion_(){
  reiniciarTimerSesion_();
  ['click','touchstart','keydown','scroll'].forEach(ev =>
    document.addEventListener(ev, reiniciarTimerSesion_, { passive: true })
  );
}
window.addEventListener('pageshow', function(event){
  if (event.persisted) window.location.reload();
});
function salirPortal() {
  clearTimeout(sesionLockTimer);
  localStorage.removeItem('portal_sesion');
  window.location.href = 'https://repmacsa.github.io/Portal/';
}

function intentarEntrarConPortal() {
  const sesion = leerSesionPortal_();
  if (sesion) {
    usuarioPortal = { nombre: sesion.nombre, rol: sesion.rol };
    document.getElementById('sinAccesoBox').style.display = 'none';
    document.getElementById('appBox').style.display = 'block';
    document.getElementById('usuarioPortalTxt').textContent = '👋 ' + sesion.nombre;
    activarVigilanciaSesion_();
    cargarMisPedidos();
  } else {
    document.getElementById('sinAccesoBox').style.display = 'block';
  }
}

// ══ NAVEGACIÓN DE TABS ══
function mostrarTab(tab) {
  document.getElementById('vistaNuevo').style.display = tab === 'nuevo' ? 'block' : 'none';
  document.getElementById('vistaMisPedidos').style.display = tab === 'mis' ? 'block' : 'none';
  document.getElementById('tabNuevo').className = tab === 'nuevo' ? 'active' : '';
  document.getElementById('tabMisPedidos').className = tab === 'mis' ? 'active' : '';
  if (tab === 'mis') cargarMisPedidos();
}

// ══ NUEVO PEDIDO ══
async function crearPedido() {
  const div = document.getElementById('resultadoNuevo');
  const material = document.getElementById('material').value.trim();
  if (!material) { div.innerHTML = '❌ Indicá qué material necesitás.'; div.style.color = '#dc2626'; return; }
  const detalle = document.getElementById('detalle').value.trim();
  const btn = document.getElementById('btnRegistrarPedido');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    const res = await api('crearPedido', { material, detalle, tecnico: usuarioPortal.nombre });
    div.style.color = '#166534';
    div.innerHTML = '✅ Pedido registrado (' + res.id + ') — esperá que Administración lo clasifique.';
    document.getElementById('material').value = '';
    document.getElementById('detalle').value = '';
  } catch (e) {
    div.style.color = '#dc2626';
    div.innerHTML = '❌ ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Registrar pedido';
  }
}

// ══ MIS PEDIDOS ══
const COLOR_ESTADO = {
  'Solicitado': '#94a3b8', 'Autorizado': '#0ea5e9', 'Rechazado': '#dc2626',
  'Pendiente de factura': '#d97706', 'Tomado': '#7c3aed', 'Listo': '#16a34a', 'Cerrado': '#475569'
};

async function cargarMisPedidos() {
  const cont = document.getElementById('listaMisPedidos');
  cont.innerHTML = 'Cargando...';
  try {
    const res = await api('listarMisPedidos', { tecnico: usuarioPortal.nombre });
    const pedidos = res.pedidos || [];

    const pendientesDeAccion = pedidos.filter(p => p.Tipo === 'Urgente' && p.Estado === 'Autorizado').length;
    const badge = document.getElementById('badgeMisPedidos');
    if (pendientesDeAccion > 0) { badge.style.display = 'inline-block'; badge.textContent = pendientesDeAccion; }
    else { badge.style.display = 'none'; }

    if (!pedidos.length) { cont.innerHTML = '<p style="color:var(--muted);font-size:13px;">Todavía no cargaste ningún pedido.</p>'; return; }
    cont.innerHTML = pedidos.map(function(p) {
      const claseTipo = p.Tipo === 'Urgente' ? 'urgente' : p.Tipo === 'Reservar' ? 'reservar' : '';
      const color = p.Tipo ? (COLOR_ESTADO[p.Estado] || '#64748b') : '#94a3b8';
      const necesitaAccion = p.Tipo === 'Urgente' && p.Estado === 'Autorizado';
      const alertaTop = necesitaAccion ? '<div style="color:#dc2626;font-weight:700;font-size:12px;margin-bottom:4px;">⚠️ Acción tuya pendiente</div>' : '';
      const asignadoTxt = p.Asignado_Por ? '<div style="font-size:11.5px;color:#0369a1;font-weight:700;margin-bottom:3px;">📤 Asignado por ' + p.Asignado_Por + '</div>' : '';
      let accion = '';
      if (!p.Tipo) {
        accion = '<div class="accion-box"><p style="font-size:12.5px;margin:0;color:var(--muted);">⏳ Esperando que Administración clasifique este pedido.</p></div>';
      } else if (p.Tipo === 'Urgente' && p.Estado === 'Autorizado') {
        accion = '<div class="accion-box">' +
          '<p style="font-size:12.5px;margin:0 0 8px;">✅ Autorizado — ya podés ir a comprarlo.</p>' +
          '<label style="margin-top:0;">Proveedor</label><input type="text" id="prov-' + p.ID + '" placeholder="Nombre del proveedor">' +
          '<label>Monto ($)</label><input type="number" id="monto-' + p.ID + '" placeholder="0">' +
          '<button class="guardar" style="margin-top:10px;" onclick="marcarComprado(\'' + p.ID + '\')">Ya lo compré</button>' +
          '</div>';
      } else if (p.Tipo === 'Urgente' && p.Estado === 'Pendiente de factura') {
        accion = '<div class="accion-box"><p style="font-size:12.5px;margin:0;color:#92400e;">📄 Pendiente: llevar la factura a Franco/Tomás para cerrar el pedido.</p></div>';
      } else if (p.Tipo === 'Urgente' && p.Estado === 'Rechazado') {
        accion = '<div class="accion-box"><p style="font-size:12.5px;margin:0;color:#991b1b;">Motivo: ' + (p.Motivo_Rechazo || '-') + '</p></div>';
      } else if (p.Tipo === 'Reservar' && p.Estado === 'Solicitado') {
        accion = '<div class="accion-box"><p style="font-size:12.5px;margin:0;color:var(--muted);">Esperando que Administración lo tome.</p></div>';
      } else if (p.Tipo === 'Reservar' && p.Estado === 'Tomado') {
        accion = '<div class="accion-box"><p style="font-size:12.5px;margin:0;color:#5b21b6;">🔄 Administración ya lo está gestionando.</p></div>';
      } else if (p.Tipo === 'Reservar' && p.Estado === 'Listo') {
        accion = '<div class="accion-box"><p style="font-size:12.5px;margin:0;color:#166534;">✅ Ya está disponible.</p></div>';
      }
      return '<div class="pedido-item ' + claseTipo + '"' + (necesitaAccion ? ' style="background:#fff9f0;box-shadow:0 0 0 2px #fca5a5 inset;"' : '') + '>' +
        '<div class="pedido-top"><div>' +
        alertaTop + asignadoTxt +
        '<div class="pedido-mat">' + p.Material + '</div>' +
        '<div class="pedido-id">' + p.ID + ' · ' + p.Fecha_Solicitud + '</div>' +
        '</div></div>' +
        (p.Detalle ? '<div class="pedido-det">' + p.Detalle + '</div>' : '') +
        '<span class="badge" style="background:' + color + '">' + p.Estado + '</span>' +
        accion +
        '</div>';
    }).join('');
  } catch (e) {
    cont.innerHTML = '<p style="color:#dc2626;">Error: ' + e.message + '</p>';
  }
}

async function marcarComprado(id) {
  const proveedor = document.getElementById('prov-' + id).value.trim();
  const monto = document.getElementById('monto-' + id).value;
  if (!proveedor) { alert('Indicá el proveedor.'); return; }
  try {
    await api('marcarComprado', { id, proveedor, monto, quien: usuarioPortal.nombre });
    await cargarMisPedidos();
  } catch (e) { alert('Error: ' + e.message); }
}

intentarEntrarConPortal();
</script>
</body>
</html>
